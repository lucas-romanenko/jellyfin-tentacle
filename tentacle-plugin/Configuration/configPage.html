<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Tentacle</title>
</head>
<body>
    <div id="TentacleConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <h2 class="sectionTitle">Tentacle</h2>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="txtTentacleUrl">Tentacle URL</label>
                        <input id="txtTentacleUrl" type="text" is="emby-input"
                               placeholder="http://192.168.1.100:8888" />
                        <div class="fieldDescription">The URL where your Tentacle dashboard is running. The plugin uses this to fetch home screen layout and playlist data.</div>
                    </div>
                </div>

                <div class="verticalSection" style="margin-top:1em;">
                    <button is="emby-button" type="button" class="raised button-submit block"
                            onclick="TentacleSave()">
                        <span>Save</span>
                    </button>
                </div>

                <div id="saveMsg" style="margin-top:0.5em;padding:0.5em;display:none;font-size:14px;"></div>

                <div class="verticalSection" style="margin-top:1em;">
                    <button is="emby-button" type="button" class="raised"
                            onclick="TentacleTest()">
                        <span>Test Connection</span>
                    </button>
                    <span id="testResult" style="margin-left:1em;font-size:14px;"></span>
                </div>

                <div id="statusInfo" class="verticalSection" style="margin-top:1em;display:none;">
                    <h3 class="sectionTitle">Tentacle Status</h3>
                    <div id="statusDetails" style="font-size:14px;"></div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            var PLUGIN_ID = 'b7e3f1a9-2c4d-4856-9a1b-8def23456789';

            document.querySelector('#TentacleConfigPage').addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(PLUGIN_ID).then(function (config) {
                    document.querySelector('#txtTentacleUrl').value = config.TentacleUrl || '';
                    Dashboard.hideLoadingMsg();
                });
            });

            function TentacleSave() {
                var url = document.querySelector('#txtTentacleUrl').value.trim();
                var msgEl = document.querySelector('#saveMsg');
                msgEl.style.display = 'block';
                msgEl.style.color = '#aaa';
                msgEl.textContent = 'Saving...';

                ApiClient.getPluginConfiguration(PLUGIN_ID).then(function (config) {
                    config.TentacleUrl = url;
                    return ApiClient.updatePluginConfiguration(PLUGIN_ID, config);
                }).then(function (result) {
                    msgEl.style.color = '#4caf50';
                    msgEl.textContent = url ? 'Saved: ' + url : 'Saved (no URL set — plugin inactive)';
                    Dashboard.processPluginConfigurationUpdateResult(result);
                })['catch'](function (err) {
                    msgEl.style.color = '#f44336';
                    msgEl.textContent = 'Save failed: ' + (err.message || err);
                });
            }

            function TentacleTest() {
                var url = document.querySelector('#txtTentacleUrl').value.trim();
                var resultEl = document.querySelector('#testResult');
                var statusEl = document.querySelector('#statusInfo');
                var detailsEl = document.querySelector('#statusDetails');

                if (!url) {
                    resultEl.innerHTML = '<span style="color:#f44336;">Enter a URL first</span>';
                    return;
                }

                resultEl.innerHTML = '<span style="color:#aaa;">Testing...</span>';
                statusEl.style.display = 'none';

                // Tested by the plugin, from the Jellyfin server: that's where it
                // calls this URL. From the browser the test failed for server-side
                // addresses, other Jellyfin origins (CORS) and http from https (#290).
                fetch(ApiClient.getUrl('Tentacle/TestConnection', { url: url }), {
                    headers: { 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"' }
                }).then(function (resp) {
                    return resp.json().catch(function () { return {}; }).then(function (data) {
                        if (!resp.ok) {
                            resultEl.textContent = '';
                            var err = document.createElement('span');
                            err.style.color = '#f44336';
                            err.textContent = data.error || ('HTTP ' + resp.status);
                            resultEl.appendChild(err);
                            return;
                        }
                        resultEl.innerHTML = '<span style="color:#4caf50;">Connected!</span>';
                        statusEl.style.display = 'block';
                        detailsEl.innerHTML =
                            '<div>Movies: <strong>' + (Number(data.movies) || 0) + '</strong></div>' +
                            '<div>Series: <strong>' + (Number(data.series) || 0) + '</strong></div>' +
                            '<div>Last Sync: <span id="tentacleLastSync"></span></div>';
                        detailsEl.querySelector('#tentacleLastSync').textContent = data.last_sync || 'Never';
                    });
                })['catch'](function () {
                    resultEl.innerHTML = '<span style="color:#f44336;">Could not ask Jellyfin</span>';
                });
            }
        </script>
    </div>
</body>
</html>
