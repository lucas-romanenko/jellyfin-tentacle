name: Feature request
description: Suggest a new feature or a change to how Tentacle works
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The maintainer decides what gets built; you'll get an answer here either way.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What are you trying to do, and what gets in the way today?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "What should Tentacle (or the plugin, or the TV app) do? How would you use it?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: "Workarounds you use now, other tools that do this, or other ways to solve it."
  - type: input
    id: tentacle-version
    attributes:
      label: Tentacle version you use
      placeholder: "e.g. 1.9.0"
