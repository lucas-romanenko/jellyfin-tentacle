name: Plugin Release

on:
  push:
    tags:
      - 'plugin-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/plugin-v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_version=${TAG}.0" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          cd tentacle-plugin
          dotnet build -c Release /p:Version=${{ steps.version.outputs.full_version }}

      - name: Create zip
        run: |
          cd tentacle-plugin/bin/Release/net9.0
          zip -j tentacle-plugin-v${{ steps.version.outputs.version }}.zip Jellyfin.Plugin.Tentacle.dll

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(md5sum tentacle-plugin/bin/Release/net9.0/tentacle-plugin-v${{ steps.version.outputs.version }}.zip | awk '{print $1}')
          echo "md5=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Jellyfin Tentacle Plugin v${{ steps.version.outputs.version }}"
          body: |
            ## Jellyfin Tentacle Plugin v${{ steps.version.outputs.version }}

            ### Install
            1. In Jellyfin → Dashboard → Plugins → Repositories → Add:
               ```
               https://raw.githubusercontent.com/lucas-romanenko/jellyfin-tentacle/main/tentacle-plugin/manifest.json
               ```
            2. Go to Catalog → Tentacle → Install
            3. Restart Jellyfin

            **Checksum (MD5):** `${{ steps.checksum.outputs.md5 }}`
          files: |
            tentacle-plugin/bin/Release/net9.0/tentacle-plugin-v${{ steps.version.outputs.version }}.zip

      # Verify the release asset is actually downloadable before publishing the manifest.
      # If the release/upload failed, the sourceUrl would 404 — so we must not commit the
      # manifest pointing at it.
      - name: Verify release asset is downloadable
        run: |
          URL="https://github.com/lucas-romanenko/jellyfin-tentacle/releases/download/plugin-v${{ steps.version.outputs.version }}/tentacle-plugin-v${{ steps.version.outputs.version }}.zip"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i: HTTP $CODE for $URL"
            if [ "$CODE" = "200" ]; then
              echo "Release asset is available."
              exit 0
            fi
            sleep 10
          done
          echo "Release asset never returned 200 — aborting before manifest commit."
          exit 1

      # Update the manifest on a CLEAN main checkout. Editing manifest.json while on the
      # detached tag commit makes `git checkout main` abort ("local changes would be
      # overwritten"), so we switch to main first and regenerate the entry there.
      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          export VERSION="${{ steps.version.outputs.version }}"
          export FULL_VERSION="${{ steps.version.outputs.full_version }}"
          export CHECKSUM="${{ steps.checksum.outputs.md5 }}"
          export TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 <<'PYEOF'
          import json, os

          version = os.environ["VERSION"]
          full_version = os.environ["FULL_VERSION"]
          checksum = os.environ["CHECKSUM"]
          timestamp = os.environ["TIMESTAMP"]

          with open("tentacle-plugin/manifest.json", "r") as f:
              manifest = json.load(f)

          new_entry = {
              "version": full_version,
              "changelog": f"Release v{version}",
              "targetAbi": "10.11.0.0",
              "sourceUrl": f"https://github.com/lucas-romanenko/jellyfin-tentacle/releases/download/plugin-v{version}/tentacle-plugin-v{version}.zip",
              "checksum": checksum,
              "timestamp": timestamp
          }

          # Replace existing entry with same major.minor.patch, else prepend
          versions = manifest[0]["versions"]
          replaced = False
          for i, v in enumerate(versions):
              if v["version"] == full_version:
                  versions[i] = new_entry
                  replaced = True
                  break
          if not replaced:
              versions.insert(0, new_entry)

          with open("tentacle-plugin/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

          git add tentacle-plugin/manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "Update plugin manifest for v${{ steps.version.outputs.version }}"
          # Rebase + retry to tolerate concurrent pushes to main.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Manifest pushed."
              exit 0
            fi
            echo "Push attempt $i failed — retrying after rebase."
            sleep 5
          done
          echo "Failed to push manifest after retries."
          exit 1
