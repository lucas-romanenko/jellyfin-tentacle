name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # sqlalchemy: the guard tests exercise the real Movie/Series models
        # against an in-memory SQLite DB rather than mocking the ORM.
        run: pip install requests sqlalchemy
      - name: Run unit tests
        working-directory: tentacle
        run: python -m unittest discover -s tests -v
