name: Tests

# every push (any branch or tag) and every pull request; publishing is
# separate (docker-publish.yml, docs.yml: releases only)
on:
  push:
  pull_request:

jobs:
  shard:
    # The suite in 4 parallel jobs of whole test modules, balanced by
    # tentacle/tests/durations.json (tests/shards.py); scripts/check -j 4 runs
    # the same shards locally.
    name: unit ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tentacle/requirements.txt
      - name: Install dependencies
        # The real requirements, not a hand-picked subset: the suite now starts
        # the app to test its routing, so anything main.py imports has to be
        # here. Picking packages one at a time meant a test that exercised more
        # of the app failed in CI while passing locally.
        run: pip install -r tentacle/requirements.txt
      - name: Run unit tests
        # The same script as the workbench's pre-push check: it also fails when
        # a test leaves files in TMPDIR.
        run: scripts/check --shard ${{ matrix.shard }}/4 -j 2 -v
        env:
          CHECK_PYTHON: python
          TENTACLE_DURATIONS: ${{ runner.temp }}/durations-${{ matrix.shard }}.json
      - name: Keep the timings
        # how long each module took here, to rebalance the shards (tests/shards.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

  unit:
    # The check the main ruleset requires: green only when every shard is.
    # (A matrix job reports one check per shard, "unit 1/4" ..., so the
    # required name comes from this job.)
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.shard.result }}" = success
