name: Docker Publish

# Images go to other people's servers, so publishing is a release: only a
# version tag (vX.Y.Z) or a GitHub release publishes, never a push to main.
# A release made in the GitHub UI can fire both events for one tag; the
# concurrency group runs them one after the other, and the second just
# pushes the same tags again.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # a release on another tag (plugin-v*) is the plugin's, not the server's
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lucas-romanenko/jellyfin-tentacle
          # vX.Y.Z -> X.Y.Z, X.Y and latest; a pre-release (v2.0.0-rc.1)
          # gets only its own tag and never moves latest
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tentacle
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the image so /api/version can say which commit it is.
          build-args: |
            TENTACLE_COMMIT=${{ github.sha }}
            TENTACLE_BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.release.published_at || github.event.repository.pushed_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
