{% extends "base.html" %}
{% block extrahead %}
  <!-- Link previews (chats, social sites) show Tentacle's card -->
  <meta property="og:image" content="{{ config.site_url }}/images/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}/images/social-preview.png">
{% endblock %}
